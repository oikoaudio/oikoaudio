name: Build and release a product

on:
  workflow_call:
    secrets:
      WEBSITE_UPDATE_TOKEN:
        required: false
    inputs:
      product:
        type: string
        required: true
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py "${{ inputs.product }}"
      - id: config
        name: Select platform archives
        run: python scripts/release.py matrix "${{ inputs.product }}" --windows-only=${{ inputs.windows_only }} --github-output

  build:
    needs: configure
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libwayland-dev libxkbcommon-dev libxcursor-dev libxcb-dri2-0-dev libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Test plugin and core
        run: python scripts/release.py test "${{ inputs.product }}"
      - name: Build CLAP and VST3 bundles
        run: python scripts/release.py build "${{ inputs.product }}" --platform "${{ runner.os }}"
      - name: Package product archives
        run: python scripts/release.py package "${{ inputs.product }}" --platform "${{ runner.os }}" --output "dist/${{ matrix.archive }}"
      - name: Upload plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, format('refs/tags/{0}/v', inputs.product))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.product }}-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish "${{ inputs.product }}"

  website:
    name: Update website
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Rebuild website from published releases
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set WEBSITE_UPDATE_TOKEN with Actions write access to oikoaudio/web, then rerun this job. The plugin release is already published."
            exit 1
          fi
          gh api --method POST repos/oikoaudio/web/actions/workflows/deploy-pages.yml/dispatches -f ref=main
