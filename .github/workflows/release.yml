name: Release all plugins

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms for downloadable test archives, without publishing
        type: choice
        options: [all, Linux, Windows, macOS]
        default: all

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tooling and notice bytes before building
        run: python -m unittest discover -s scripts/tests
      - name: Check shared version and existing release tags
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/workspace_release.py preflight
      - id: config
        name: Select platforms
        env:
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
        run: python scripts/workspace_release.py matrix --platform "$BUILD_PLATFORM" --github-output

  build:
    needs: configure
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release tooling and notice bytes on this platform
        run: python -m unittest discover -s scripts/tests
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libwayland-dev libxkbcommon-dev libxcursor-dev libxcb-dri2-0-dev libxcb-icccm4-dev libx11-xcb-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Test plugins and cores
        run: python scripts/workspace_release.py test
      - name: Build all CLAP and VST3 bundles together
        run: python scripts/workspace_release.py build --platform "${{ runner.os }}"
      - name: Package separate product archives
        run: python scripts/workspace_release.py package --platform "${{ runner.os }}"
      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish product releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: plugins-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/workspace_release.py publish
