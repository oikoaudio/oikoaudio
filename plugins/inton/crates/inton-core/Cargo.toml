[package]
name = "inton-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libloading = "0.8"

oiko-tuning.workspace = true

[package.metadata.oiko]
role = "core"
product = "inton"
integrations = ["oiko-tuning"]
